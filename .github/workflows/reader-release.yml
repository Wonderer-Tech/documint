name: Reader UI verification and release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reader-release.yml'
      - '.github/reader-release-trigger'

permissions:
  contents: write

concurrency:
  group: reader-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply guarded reader integration
        run: python .github/repairs/reader-interface-v107.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck, bundle and unit tests
        run: npm test
      - name: Build sanitized Local and AI-format browser fixtures
        run: |
          npx esbuild test/browser/navigationFixtures.ts --bundle --platform=node --format=cjs --outfile=node_modules/documint-browser-fixtures.cjs
          node node_modules/documint-browser-fixtures.cjs
      - name: Install browser runner
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Existing navigation and chart regressions
        run: python test/browser/navigationAcceptance.py
      - name: Reader persistence, keyboard, mobile and layout acceptance
        run: python test/browser/readerAcceptance.py
      - name: Build and validate VSIX
        run: |
          mkdir -p releases
          test "$(node -p "require('./package.json').version")" = '1.0.7'
          npx @vscode/vsce package --out releases/documint-1.0.7.vsix
          unzip -t releases/documint-1.0.7.vsix
          python - <<'PY'
          import json, zipfile
          with zipfile.ZipFile('releases/documint-1.0.7.vsix') as archive:
              manifest = json.loads(archive.read('extension/package.json'))
              bundle = archive.read('extension/dist/extension.js').decode()
              assert manifest['version'] == '1.0.7'
              assert 'readerExpandAll' in bundle and 'readerIsVisible' in bundle
              assert 'local-documentation-cache-v5' in bundle
              assert 'isRelativePathInsideExcludedDirectory' in bundle
          PY
      - name: Commit verified source integration and packaged extension
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json README.md CHANGELOG.md \
            src/services/htmlTemplate.ts src/services/htmlReaderNavigation.ts \
            src/services/localDocumentationCache.ts test/localDocumentationCache.test.ts test/all.test.ts
          git add -f releases/documint-1.0.7.vsix
          if ! git diff --cached --quiet; then
            git commit -m 'feat: ship verified reader navigation and mobile UI in 1.0.7'
            git push origin HEAD:main
          fi
          git rev-parse HEAD > test-results/navigation-browser/release-commit.txt
          sha256sum releases/documint-1.0.7.vsix > test-results/navigation-browser/vsix-sha256.txt
      - name: Save verification and build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documint-reader-1.0.7-verified
          path: |
            releases/documint-1.0.7.vsix
            test-results/navigation-browser/
            src/services/htmlReader*.ts
            src/services/htmlTemplate.ts
          if-no-files-found: ignore
