name: Package VSIX

on:
  push:
    branches: [main]
    paths:
      - ".github/vsix-trigger"

permissions:
  contents: write

concurrency:
  group: package-vsix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build and commit VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Compile and test
        run: npm test

      - name: Package VSIX
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          VSIX="releases/documint-${VERSION}.vsix"
          mkdir -p releases
          npx @vscode/vsce package --out "${VSIX}"
          ls -lh "${VSIX}"
          unzip -t "${VSIX}"

      - name: Commit VSIX artifact
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          VSIX="releases/documint-${VERSION}.vsix"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "${VSIX}"
          if git diff --cached --quiet; then
            echo "VSIX artifact unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "release: add documint ${VERSION} vsix"
          git push origin HEAD:main
