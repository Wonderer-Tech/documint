name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/ci-trigger"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, bundle, and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies from lockfile
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci --no-audit --no-fund

      - name: Install dependencies without lockfile
        if: ${{ hashFiles('package-lock.json') == '' }}
        run: |
          echo "::warning::package-lock.json is missing; using npm install until the lockfile is committed."
          npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Run DocuMint self-audit
        run: npm run audit:self
