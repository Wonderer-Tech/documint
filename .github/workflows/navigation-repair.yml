name: Repair generated HTML navigation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/navigation-repair.yml"
      - ".github/repairs/generated-html-navigation.py"
      - ".github/repairs/generated-html-search.py"

permissions:
  contents: write

concurrency:
  group: navigation-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply guarded source repair
        run: |
          python .github/repairs/generated-html-navigation.py
          python .github/repairs/generated-html-search.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck, bundle and unit regressions
        run: npm test
      - name: Generate sanitized browser fixtures
        run: |
          npx esbuild test/browser/navigationFixtures.ts --bundle --platform=node --format=cjs --outfile=node_modules/documint-browser-fixtures.cjs
          node node_modules/documint-browser-fixtures.cjs
      - name: Install browser test runner
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Browser acceptance with external CDNs blocked
        run: python test/browser/navigationAcceptance.py
      - name: Package distinct 1.0.6 VSIX
        run: |
          python - <<'PY'
          from pathlib import Path
          ignore = Path('.vscodeignore')
          text = ignore.read_text()
          if 'test-results/**' not in text.splitlines():
              ignore.write_text(text.rstrip() + '\n\n# Browser acceptance evidence is not extension runtime content\ntest-results/**\n')
          PY
          mkdir -p releases
          npx @vscode/vsce package --out releases/documint-1.0.6.vsix
          unzip -t releases/documint-1.0.6.vsix
      - name: Commit verified repair and VSIX
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json README.md CHANGELOG.md .vscodeignore \
            src/services/htmlTemplate.ts src/services/localDocumentationDocument.ts \
            src/services/localDocumentationCache.ts test/localDocumentationCache.test.ts test/all.test.ts
          git add -f releases/documint-1.0.6.vsix
          git diff --cached --stat
          git commit -m "fix: restore collapsible navigation and chart runtime; package 1.0.6"
          git push origin HEAD:main
      - name: Save browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documint-navigation-verification
          path: |
            test-results/navigation-browser/*.png
            test-results/navigation-browser/results.json
            releases/documint-1.0.6.vsix
          if-no-files-found: ignore
