name: Release VSIX

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-vsix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify, package, and publish VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Require package lock
        shell: bash
        run: |
          test -f package-lock.json || {
            echo "package-lock.json is required for a reproducible release."
            exit 1
          }

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify tag matches package version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match package.json version $VERSION"
            exit 1
          fi

      - name: Verify DocuMint
        run: npm run verify

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Run browser acceptance
        run: npm run test:browser

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documint-release-browser-acceptance
          path: test-results/navigation-browser/
          if-no-files-found: warn
          retention-days: 14

      - name: Package VSIX
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p release-artifacts
          VSIX="release-artifacts/documint-${VERSION}.vsix"
          npx @vscode/vsce package --out "$VSIX"
          unzip -t "$VSIX"
          echo "VSIX=$VSIX" >> "$GITHUB_ENV"

      - name: Publish GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$VSIX" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$VSIX" \
              --title "DocuMint ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
