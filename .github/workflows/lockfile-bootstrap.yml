name: Lockfile Bootstrap

on:
  workflow_dispatch:
    inputs:
      run_readiness:
        description: "Run full verify/browser/VSIX readiness after generating the transient lockfile"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: lockfile-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    name: Generate and validate package-lock.json
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate lockfile identity
        run: npm run lockfile:validate

      - name: Validate clean locked install
        run: npm ci --no-audit --no-fund

      - name: Validate dependency graph
        run: npm ls --all

      - name: Record lockfile metadata
        shell: bash
        run: |
          mkdir -p lockfile-artifact
          cp package-lock.json lockfile-artifact/package-lock.json
          sha256sum package-lock.json | tee lockfile-artifact/package-lock.sha256
          node -e "const p=require('./package.json'); console.log(JSON.stringify({name:p.name,version:p.version,node:process.version},null,2))" > lockfile-artifact/metadata.json
          cat > lockfile-artifact/README.txt <<'EOF'
          DocuMint Lockfile Bootstrap Artifact

          From the repository root, adopt this artifact safely with:

            npm run lockfile:adopt -- /path/to/extracted/artifact

          The command validates package identity and dependency maps before replacing
          package-lock.json, then verifies the adopted SHA-256.
          EOF

      - name: Upload package lock artifact
        uses: actions/upload-artifact@v4
        with:
          name: documint-package-lock-${{ github.sha }}
          path: lockfile-artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Set up Python
        if: ${{ inputs.run_readiness }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        if: ${{ inputs.run_readiness }}
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Run full release readiness with transient lockfile
        if: ${{ inputs.run_readiness }}
        run: npm run release:readiness

      - name: Upload bootstrap readiness evidence
        if: ${{ always() && inputs.run_readiness }}
        uses: actions/upload-artifact@v4
        with:
          name: documint-bootstrap-readiness-${{ github.sha }}
          path: |
            release-artifacts/readiness/
            release-artifacts/*.vsix
            test-results/navigation-browser/
          if-no-files-found: warn
          retention-days: 14

